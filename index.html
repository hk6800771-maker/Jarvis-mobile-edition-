<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS Mobile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

  <header>
    <h1>JARVIS</h1>
    <p>MOBILE AI ASSISTANT</p>

    <div class="status">
      <div class="dot"></div>
      <span>SYSTEM ONLINE</span>
    </div>
  </header>

  <div class="arc">
    <div class="arc-inner">
      <span>J</span>
    </div>
  </div>

  <div class="panel">
    <h2>SYSTEM STATUS</h2>
    <p>JARVIS mobile system initialized.</p>
    <p>Awaiting command...</p>
  </div>

  <div class="grid">
    <div class="card">
      <h3>VOICE</h3>
      <p>Offline</p>
    </div>

    <div class="card">
      <h3>BRAIN</h3>
      <p>Standby</p>
    </div>

    <div class="card">
      <h3>MEMORY</h3>
      <p>Ready</p>
    </div>

    <div class="card">
      <h3>TOOLS</h3>
      <p>0 Active</p>
    </div>
  </div>

  <button>INITIALIZE JARVIS</button>

  <footer>
    HCB • JARVIS MOBILE EDITION
  </footer>

  </div>

</body>
</html>
